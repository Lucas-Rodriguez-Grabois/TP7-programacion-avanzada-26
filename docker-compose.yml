# =================================================================================================
# PROYECTO: RutaSur - Plataforma de Logística Orientada a Eventos
# ARCHIVO: docker-compose.yml
# RUTA: C:\Users\lrtr3\OneDrive\Desktop\facultad\programacion avanzada\TP7\docker-compose.yml
# =================================================================================================
# DESCRIPCIÓN:
# 1. Apache Kafka 3.8.0 en modo KRaft (1 Broker, sin ZooKeeper) expuesto en el puerto 9092.
# 2. Inicializador de tópicos Kafka (3 particiones por tópico y retención según catálogo oficial).
# 3. MongoDB 7.0 configurado en Replica Set de 1 nodo ('rs0') en el puerto 27017 (para Change Streams).
# 4. Inicializador del Replica Set de MongoDB.
# 5. Kafka UI (Kafbat) en el puerto 8080 para observabilidad en tiempo real.
# =================================================================================================


services:
  # ---------------------------------------------------------------------------
  # 1. APACHE KAFKA (MODO KRAFT - 1 BROKER)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: rutasur-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: '4L622nShTUiT8tCdRvtqTw'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 2. PROVISIONAMIENTO DE TÓPICOS (CATÁLOGO OFICIAL RUTASUR - 3 PARTICIONES)
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: rutasur-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command: |
      "
      echo '>> [KAFKA-INIT] Verificando y creando catálogo de tópicos de RutaSur...'
      
      # Tópicos con 30 días de retención (2592000000 ms)
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic envios.estados --partitions 3 --replication-factor 1 --config retention.ms=2592000000
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic envios.estados.dlq --partitions 3 --replication-factor 1 --config retention.ms=2592000000
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic envios.reprogramaciones --partitions 3 --replication-factor 1 --config retention.ms=2592000000
      
      # Tópicos con 7 días de retención (604800000 ms)
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic alertas.sla --partitions 3 --replication-factor 1 --config retention.ms=604800000
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic notificaciones.enviadas --partitions 3 --replication-factor 1 --config retention.ms=604800000
      
      # Tópico compactado para promesas de entrega
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic envios.promesas --partitions 3 --replication-factor 1 --config cleanup.policy=compact
      
      echo '>> [KAFKA-INIT] Tópicos disponibles en el cluster:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "

  # ---------------------------------------------------------------------------
  # 3. MONGODB 7.0 (REPLICA SET 'rs0' PARA CHANGE STREAMS)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: rutasur-mongo
    ports:
      - "27017:27017"
    entrypoint: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo-init:
    image: mongo:7.0
    container_name: rutasur-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command: |
      "
      echo '>> [MONGO-INIT] Inicializando Replica Set rs0...'
      mongosh --host mongo:27017 --eval '
        try {
          rs.status();
          console.log(\">> [MONGO-INIT] Replica Set ya se encontraba inicializado.\");
        } catch(e) {
          rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
          console.log(\">> [MONGO-INIT] Replica Set rs0 inicializado con éxito.\");
        }
      '
      "

  # ---------------------------------------------------------------------------
  # 4. OBSERVABILIDAD: KAFKA UI
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: rutasur-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rutasur-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
